name: Deploy GitHub Pages
on:
  push:
    branches: ["main", "wind-wave-v3-rc", "wind-wave-v33-rc", "wind-wave-v34-rc", "wind-wave-v35-rc", "wind-wave-v36-rc", "wind-wave-v37-rc", "wind-wave-v38-rc", "wind-wave-v39-rc", "wind-wave-v310-rc", "surface-wind-fix-v3-11", "surface-wind-v312-rc", "weather-lab-v1-rc"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Wind & Wave V3.3
        run: node scripts/build-wind-wave-v33.mjs
      - name: Build Wind & Wave V3.4
        run: node scripts/build-wind-wave-v34.mjs
      - name: Build Wind & Wave V3.5
        run: node scripts/build-wind-wave-v35.mjs
      - name: Build Wind & Wave V3.6
        run: node scripts/build-wind-wave-v36.mjs
      - name: Build Wind & Wave V3.7
        run: node scripts/build-wind-wave-v37.mjs
      - name: Build Wind & Wave V3.8
        run: node scripts/build-wind-wave-v38.mjs
      - name: Build Wind & Wave V3.9
        run: node scripts/build-wind-wave-v39.mjs
      - name: Build Wind & Wave V3.10
        run: node scripts/build-wind-wave-v310.mjs
      - name: Build Wind & Wave V3.11
        run: node scripts/build-wind-wave-v311.mjs
      - name: Build Wind & Wave V3.12
        run: node scripts/build-wind-wave-v312.mjs
      - name: Smoke test Wind & Wave
        run: node scripts/check-wind-wave.mjs
      - name: Smoke test OKA Weather Lab
        run: node scripts/check-weather-lab.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Browser interaction test OKA Weather Lab
        run: node scripts/e2e-weather-lab.mjs
      - name: Browser interaction test V3.7
        run: node scripts/e2e-wind-wave-v37.mjs
      - name: Browser interaction test V3.8
        run: node scripts/e2e-wind-wave-v38.mjs
      - name: Browser interaction test V3.9
        run: node scripts/e2e-wind-wave-v39.mjs
      - name: Browser interaction test V3.10
        run: node scripts/e2e-wind-wave-v310.mjs
      - name: Browser interaction test V3.11
        run: node scripts/e2e-wind-wave-v311.mjs
      - name: Browser interaction test V3.12
        run: node scripts/e2e-wind-wave-v312.mjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Wind & Wave V3.3
        run: node scripts/build-wind-wave-v33.mjs
      - name: Build Wind & Wave V3.4
        run: node scripts/build-wind-wave-v34.mjs
      - name: Build Wind & Wave V3.5
        run: node scripts/build-wind-wave-v35.mjs
      - name: Build Wind & Wave V3.6
        run: node scripts/build-wind-wave-v36.mjs
      - name: Build Wind & Wave V3.7
        run: node scripts/build-wind-wave-v37.mjs
      - name: Build Wind & Wave V3.8
        run: node scripts/build-wind-wave-v38.mjs
      - name: Build Wind & Wave V3.9
        run: node scripts/build-wind-wave-v39.mjs
      - name: Build Wind & Wave V3.10
        run: node scripts/build-wind-wave-v310.mjs
      - name: Build Wind & Wave V3.11
        run: node scripts/build-wind-wave-v311.mjs
      - name: Build Wind & Wave V3.12
        run: node scripts/build-wind-wave-v312.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Cache JMA tide tables
        shell: bash
        run: |
          set -u
          YEAR=$(date -u +%Y)
          for Y in $((YEAR-1)) $YEAR $((YEAR+1)); do
            mkdir -p "jma-tide/$Y"
            for STN in MZ XM; do
              URL="https://www.data.jma.go.jp/kaiyou/data/db/tide/suisan/txt/$Y/$STN.txt"
              OUT="jma-tide/$Y/$STN.txt"
              if curl -fsSL --retry 3 --connect-timeout 15 --max-time 45 "$URL" -o "$OUT"; then
                echo "cached $Y/$STN"
              else
                echo "JMA tide cache unavailable: $Y/$STN"
                rm -f "$OUT"
              fi
            done
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
