name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Smoke test Wind & Wave
        run: node scripts/check-wind-wave.mjs
      - name: Cache JMA tide tables
        shell: bash
        run: |
          set -u
          YEAR=$(date -u +%Y)
          for Y in $((YEAR-1)) $YEAR $((YEAR+1)); do
            mkdir -p "jma-tide/$Y"
            for STN in MZ XM; do
              URL="https://www.data.jma.go.jp/kaiyou/data/db/tide/suisan/txt/$Y/$STN.txt"
              OUT="jma-tide/$Y/$STN.txt"
              if curl -fsSL --retry 3 --connect-timeout 15 --max-time 45 "$URL" -o "$OUT"; then
                echo "cached $Y/$STN"
              else
                echo "JMA tide cache unavailable: $Y/$STN"
                rm -f "$OUT"
              fi
            done
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
