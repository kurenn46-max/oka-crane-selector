<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#07131e">
<title>OKA Wind & Wave Lite</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#07131e;color:#fff}
body{display:grid;grid-template-rows:auto auto auto 1fr auto;overflow:hidden}
header{padding:10px 12px;background:#0b1d2b;border-bottom:1px solid #294354}
h1{font-size:17px;margin:0}.sub{font-size:11px;color:#abc0cd;margin-top:2px}
#jsState{margin-top:5px;font-size:12px;font-weight:800;color:#7af0a4}
.search{padding:8px;background:#0d2231;border-bottom:1px solid #294354}
.row{display:grid;grid-template-columns:1fr auto;gap:7px}
input,button{font:inherit;border-radius:11px;border:1px solid #345064}
input{min-width:0;background:#102a3b;color:#fff;padding:11px}
button{background:#17374a;color:#fff;padding:10px 12px;font-weight:800}
button.primary{background:#58bcff;color:#00131f;border:0}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}.actions button{font-size:11px;padding:8px 3px}
#status{padding:7px 10px;background:#101d26;color:#d5e4ee;font-size:12px;border-bottom:1px solid #28404f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapWrap{position:relative;min-height:0;background:#183247;overflow:hidden}
#baseMap{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#173244}
#overlay{position:absolute;inset:0;pointer-events:none}
.circle{position:absolute;left:50%;top:50%;width:82%;max-height:82%;aspect-ratio:1/1;transform:translate(-50%,-50%);border:2px solid #58bcff;border-radius:50%;background:rgba(88,188,255,.04)}
.center{position:absolute;left:50%;top:50%;width:15px;height:15px;transform:translate(-50%,-50%);border:3px solid white;border-radius:50%;background:#ff5c58;box-shadow:0 1px 5px #000}
.marker{position:absolute;transform:translate(-50%,-50%);text-align:center;filter:drop-shadow(0 1px 2px #000)}
.arrow{font-size:26px;line-height:22px;font-weight:900;color:#56c0ff;transform-origin:50% 50%}
.tag{display:inline-block;margin-top:2px;padding:2px 5px;border-radius:7px;background:rgba(0,15,24,.9);border:1px solid rgba(255,255,255,.24);font-size:10px;font-weight:900;white-space:nowrap}
.bottom{background:#0b1d2b;border-top:1px solid #294354;padding:9px}
.place{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.card{background:#102a3b;border:1px solid #304b5c;border-radius:10px;padding:7px}
.label{font-size:10px;color:#9eb5c3}.value{font-size:15px;font-weight:900;margin-top:2px}.note{font-size:9px;color:#9eb5c3;margin-top:5px}
#error{display:none;margin-top:6px;color:#ffb2b2;font-size:11px}
</style>
</head>
<body>
<header><h1>OKA Wind & Wave Lite</h1><div class="sub">外部地図ライブラリなし・動作診断版</div><div id="jsState">JavaScript確認中…</div></header>
<section class="search">
<form id="searchForm" class="row"><input id="query" placeholder="住所・地名・緯度,経度"><button class="primary" type="submit">検索</button></form>
<div class="actions"><button type="button" id="testBtn">動作テスト</button><button type="button" id="locateBtn">📍現在地</button><button type="button" id="refreshBtn">↻更新</button><button type="button" id="kyotoBtn">京都</button></div>
<div id="error"></div>
</section>
<div id="status">起動しています…</div>
<div id="mapWrap"><iframe id="baseMap" title="地図"></iframe><div id="overlay"><div class="circle"></div><div class="center"></div></div></div>
<section class="bottom">
<div class="place" id="place">京都市付近</div>
<div class="cards">
<div class="card"><div class="label">中心の風</div><div class="value" id="wind">-- m/s</div><div class="label" id="windDir">--</div></div>
<div class="card"><div class="label">最大瞬間</div><div class="value" id="gust">-- m/s</div><div class="label">10m高度</div></div>
<div class="card"><div class="label">波</div><div class="value" id="wave">-- m</div><div class="label" id="period">周期 -- s</div></div>
</div>
<div class="note">青矢印＝風が流れていく方向。地図は固定表示で、半径5km内の風を約2km間隔で表示。</div>
</section>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const START={lat:35.0116,lng:135.7681};
let center={...START},placeName="京都市付近",testCount=0;
$("jsState").textContent="✅ JavaScript 起動OK";
$("status").textContent="データ取得準備OK";
function setStatus(s){$("status").textContent=s}
function showError(s){$("error").textContent=s;$("error").style.display="block"}
function clearError(){$("error").style.display="none"}
function compass(d){if(!Number.isFinite(d))return"--";const a=["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"];return a[Math.round((((d%360)+360)%360)/22.5)%16]}
function dest(lat,lng,km,bearing){const R=6371,d=km/R,b=bearing*Math.PI/180,p1=lat*Math.PI/180,l1=lng*Math.PI/180;const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(b));const l2=l1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));return{lat:p2*180/Math.PI,lng:l2*180/Math.PI}}
function hav(a,b){const R=6371,t=x=>x*Math.PI/180,dp=t(b.lat-a.lat),dl=t(b.lng-a.lng),x=Math.sin(dp/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function parseCoord(s){const m=s.trim().match(/^(-?\d{1,2}(?:\.\d+)?)\s*[,， ]\s*(-?\d{1,3}(?:\.\d+)?)$/);if(!m)return null;const lat=Number(m[1]),lng=Number(m[2]);return Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat,lng}:null}
function points(){const arr=[{lat:center.lat,lng:center.lng,n:0,e:0}];[-4,-2,0,2,4].forEach(n=>[-4,-2,0,2,4].forEach(e=>{if(n===0&&e===0)return;if(Math.hypot(n,e)>5)return;const km=Math.hypot(n,e),br=(Math.atan2(e,n)*180/Math.PI+360)%360,p=dest(center.lat,center.lng,km,br);arr.push({...p,n,e})}));return arr}
function mapUrl(){const latSpan=.055,lngSpan=.072/Math.max(.4,Math.cos(center.lat*Math.PI/180));const left=center.lng-lngSpan,right=center.lng+lngSpan,bottom=center.lat-latSpan,top=center.lat+latSpan;return "https://www.openstreetmap.org/export/embed.html?bbox="+encodeURIComponent(left+","+bottom+","+right+","+top)+"&layer=mapnik&marker="+encodeURIComponent(center.lat+","+center.lng)}
function updateBaseMap(){$("baseMap").src=mapUrl();$("place").textContent=placeName+"　(半径5km)"}
function clearWindMarkers(){document.querySelectorAll(".windMarker").forEach(x=>x.remove())}
function addWindMarker(p,speed,from){const el=document.createElement("div");el.className="marker windMarker";el.style.left=(50+(p.e/12)*100)+"%";el.style.top=(50-(p.n/12)*100)+"%";const to=(from+180)%360;el.innerHTML='<div class="arrow" style="transform:rotate('+to+'deg)">↑</div><div class="tag">'+speed.toFixed(1)+' m/s</div>';$("overlay").appendChild(el)}
async function getWind(ps){const u=new URL("https://api.open-meteo.com/v1/forecast");u.searchParams.set("latitude",ps.map(p=>p.lat.toFixed(5)).join(","));u.searchParams.set("longitude",ps.map(p=>p.lng.toFixed(5)).join(","));u.searchParams.set("current","wind_speed_10m,wind_direction_10m,wind_gusts_10m");u.searchParams.set("wind_speed_unit","ms");u.searchParams.set("timezone","auto");const r=await fetch(u);if(!r.ok)throw new Error("風API "+r.status);const d=await r.json();return Array.isArray(d)?d:[d]}
async function getWave(){const u=new URL("https://marine-api.open-meteo.com/v1/marine");u.searchParams.set("latitude",center.lat.toFixed(5));u.searchParams.set("longitude",center.lng.toFixed(5));u.searchParams.set("current","wave_height,wave_period");u.searchParams.set("cell_selection","sea");u.searchParams.set("timezone","auto");const r=await fetch(u);if(!r.ok)throw new Error("波API "+r.status);return r.json()}
async function refresh(){clearError();setStatus("風データ取得中…");updateBaseMap();try{const ps=points(),rows=await getWind(ps);clearWindMarkers();rows.forEach((x,i)=>{const s=x.current&&x.current.wind_speed_10m,d=x.current&&x.current.wind_direction_10m;if(Number.isFinite(s)&&Number.isFinite(d))addWindMarker(ps[i],s,d)});const c=rows[0]&&rows[0].current||{};$("wind").textContent=Number.isFinite(c.wind_speed_10m)?c.wind_speed_10m.toFixed(1)+" m/s":"-- m/s";$("windDir").textContent=Number.isFinite(c.wind_direction_10m)?compass(c.wind_direction_10m)+"から":"--";$("gust").textContent=Number.isFinite(c.wind_gusts_10m)?c.wind_gusts_10m.toFixed(1)+" m/s":"-- m/s";setStatus("風OK。波データ確認中…");try{const w=await getWave(),model={lat:Number(w.latitude),lng:Number(w.longitude)},near=Number.isFinite(model.lat)&&hav({lat:center.lat,lng:center.lng},model)<=5,cur=w.current||{};$("wave").textContent=near&&Number.isFinite(cur.wave_height)?cur.wave_height.toFixed(1)+" m":"海域外";$("period").textContent=near&&Number.isFinite(cur.wave_period)?"周期 "+cur.wave_period.toFixed(1)+" s":"周期 -- s"}catch(_){$("wave").textContent="取得不可";$("period").textContent="周期 -- s"}setStatus("✅ 表示更新完了")}catch(e){showError("データ取得で停止："+(e.message||e));setStatus("⚠️ データ取得失敗")}}
async function geocode(q){const c=parseCoord(q);if(c)return{...c,name:q};const u=new URL("https://nominatim.openstreetmap.org/search");u.searchParams.set("format","jsonv2");u.searchParams.set("q",q);u.searchParams.set("limit","1");u.searchParams.set("countrycodes","jp");u.searchParams.set("accept-language","ja");const r=await fetch(u,{headers:{"Accept":"application/json"}});if(!r.ok)throw new Error("住所検索 "+r.status);const a=await r.json();if(!a.length)throw new Error("地点が見つかりません");return{lat:Number(a[0].lat),lng:Number(a[0].lon),name:a[0].display_name}}
async function setCenter(c,name){center={lat:Number(c.lat),lng:Number(c.lng)};placeName=name||center.lat.toFixed(5)+","+center.lng.toFixed(5);await refresh()}
$("testBtn").addEventListener("click",()=>{testCount++;$("jsState").textContent="✅ ボタン動作OK "+testCount+"回";setStatus("ボタンは正常に反応しています")});
$("refreshBtn").addEventListener("click",refresh);
$("kyotoBtn").addEventListener("click",()=>setCenter(START,"京都市付近"));
$("locateBtn").addEventListener("click",()=>{clearError();setStatus("現在地取得中…");if(!navigator.geolocation){showError("このブラウザは現在地に非対応");return}navigator.geolocation.getCurrentPosition(p=>setCenter({lat:p.coords.latitude,lng:p.coords.longitude},"現在地"),e=>{showError("現在地エラー："+e.message);setStatus("現在地を取得できません")},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})});
$("searchForm").addEventListener("submit",async e=>{e.preventDefault();const q=$("query").value.trim();if(!q)return;clearError();setStatus("住所検索中…");try{const r=await geocode(q);await setCenter(r,r.name)}catch(err){showError(err.message||"検索失敗");setStatus("住所検索失敗")}});
updateBaseMap();refresh();
})();
</script>
</body>
</html>
