<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07131e">
<title>OKA Wind & Wave Lite</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#07131e;color:#fff}
body{display:grid;grid-template-rows:auto auto auto 1fr auto;overflow:hidden}
header{padding:9px 12px;background:#0b1d2b;border-bottom:1px solid #294354}
h1{font-size:17px;margin:0}.sub{font-size:11px;color:#abc0cd;margin-top:2px}
.search{padding:8px;background:#0d2231;border-bottom:1px solid #294354}
.row{display:grid;grid-template-columns:1fr auto;gap:7px}
input,button{font:inherit;border-radius:11px;border:1px solid #345064}
input{min-width:0;background:#102a3b;color:#fff;padding:11px;font-size:16px}
button{background:#17374a;color:#fff;padding:10px 12px;font-weight:800;touch-action:manipulation}
button.primary{background:#58bcff;color:#00131f;border:0}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}.actions button{font-size:12px;padding:8px 3px}
#status{padding:7px 10px;background:#101d26;color:#d5e4ee;font-size:12px;border-bottom:1px solid #28404f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modelRow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:7px}
.modelRow label{font-size:11px;color:#a9bdca;font-weight:800}
.modelRow select{width:100%;min-width:0;background:#102a3b;color:#fff;border:1px solid #345064;border-radius:9px;padding:8px 9px;font-size:13px}
#compareBtn{padding:8px 9px;font-size:11px;border-radius:9px;white-space:nowrap}
#compareBtn.active{background:#58bcff;color:#00131f;border-color:#58bcff}
.marker.warn .arrow{color:#f4c84a}.marker.warn .tag{border-color:#f4c84a;background:rgba(91,69,0,.92)}
.marker.bad .arrow{color:#ff7474}.marker.bad .tag{border-color:#ff7474;background:rgba(105,30,30,.94)}
.compareLegend{font-size:9px;color:#a9bdca;margin-top:3px}
.modelNote{font-size:9px;color:#9eb5c3;margin-top:4px}
#mapWrap{position:relative;min-height:0;background:#183247;overflow:hidden;touch-action:none;user-select:none}
#tiles,#windLayer{position:absolute;inset:0;overflow:hidden}
.tile{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
#windLayer{pointer-events:none}
.circle{position:absolute;border:2px solid #58bcff;border-radius:50%;background:rgba(88,188,255,.035);transform:translate(-50%,-50%);pointer-events:none}
.center{position:absolute;left:50%;top:50%;width:17px;height:17px;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:50%;background:#ff5c58;box-shadow:0 1px 5px #000;z-index:8}
.marker{position:absolute;transform:translate(-50%,-50%);text-align:center;filter:drop-shadow(0 1px 2px #000);z-index:7}
.arrow{font-size:25px;line-height:21px;font-weight:900;color:#56c0ff;transform-origin:50% 50%}
.tag{display:inline-block;margin-top:2px;padding:2px 5px;border-radius:7px;background:rgba(0,15,24,.9);border:1px solid rgba(255,255,255,.24);font-size:10px;font-weight:900;white-space:nowrap}
.zoom{position:absolute;right:10px;top:10px;z-index:12;display:grid;gap:5px}
.zoom button{width:46px;height:46px;padding:0;font-size:26px;background:rgba(9,27,39,.94)}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:11;background:rgba(4,18,27,.9);border:1px solid #365061;border-radius:999px;padding:6px 10px;font-size:11px;white-space:nowrap;pointer-events:none}
.attrib{position:absolute;right:4px;bottom:3px;z-index:10;background:rgba(255,255,255,.8);color:#222;font-size:8px;padding:1px 3px}
.bottom{background:#0b1d2b;border-top:1px solid #294354;padding:9px}
.place{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.card{background:#102a3b;border:1px solid #304b5c;border-radius:10px;padding:7px}
.label{font-size:10px;color:#9eb5c3}.value{font-size:15px;font-weight:900;margin-top:2px}.note{font-size:9px;color:#9eb5c3;margin-top:5px}
#error{display:none;margin-top:6px;color:#ffb2b2;font-size:11px}
#forecastBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
#forecastPanel{display:none;position:fixed;left:0;right:0;bottom:0;z-index:41;background:#0b1d2b;border-top:1px solid #436071;border-radius:18px 18px 0 0;max-height:58%;padding:10px;box-shadow:0 -6px 20px rgba(0,0,0,.35)}
#forecastPanel.open,#forecastBackdrop.open{display:block}
.forecastTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.forecastTitle{font-size:14px;font-weight:900}
.forecastBtns{display:flex;gap:5px;flex-wrap:wrap}
.forecastBtns button{padding:6px 9px;font-size:11px;border-radius:8px}
.forecastBtns button.active{background:#58bcff;color:#00131f;border-color:#58bcff}
#forecastList{display:flex;gap:7px;overflow-x:auto;padding:9px 1px 5px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.hourCard{flex:0 0 94px;scroll-snap-align:start;text-align:left;background:#102a3b;border:1px solid #304b5c;color:#fff;border-radius:10px;padding:8px;min-height:88px}
.hourCard.active{border-color:#58bcff;background:#15364a}
.hourTime{font-size:11px;font-weight:900}
.hourWind{font-size:16px;font-weight:900;margin-top:4px}
.hourMeta{font-size:9px;color:#a9bdca;margin-top:3px;line-height:1.35}
.forecastFoot{display:flex;gap:6px;margin-top:5px}
.forecastFoot button{flex:1}
.dragging .hint{display:none}
</style>
</head>
<body>
<header>
<h1>OKA Wind & Wave Lite</h1>
<div class="sub">地図を指で動かして、その中心の風・波を表示</div>
</header>
<section class="search">
<form id="searchForm" class="row">
<input id="query" placeholder="住所・地名（例：小浜市堅海）">
<button class="primary" type="submit">検索</button>
</form>
<div class="actions">
<button type="button" id="locateBtn">📍現在地</button>
<button type="button" id="forecastBtn">🕒予報</button>
<button type="button" id="refreshBtn">↻更新</button>
<button type="button" id="kyotoBtn">京都</button>
</div>
<div class="modelRow">
<label for="modelSelect">風モデル</label>
<select id="modelSelect">
  <option value="best_match">Best Match（自動）</option>
  <option value="jma_msm">JMA MSM（約5km）</option>
  <option value="ecmwf_ifs">ECMWF IFS（約9km）</option>
</select>
<button type="button" id="compareBtn">3モデル比較 OFF</button>
</div>
<div id="modelNote" class="modelNote">Open-Meteo Best Match</div>
<div id="compareSummary" class="compareLegend"></div>
<div id="error"></div>
</section>
<div id="status">起動しています…</div>
<div id="mapWrap">
<div id="tiles"></div>
<div id="windLayer"></div>
<div id="rangeCircle" class="circle"></div>
<div class="center"></div>
<div class="hint">地図を指で動かす → 離すと更新</div>
<div class="zoom"><button type="button" id="zoomIn" aria-label="拡大">＋</button><button type="button" id="zoomOut" aria-label="縮小">−</button></div>
<div class="attrib">© OpenStreetMap contributors</div>
</div>
<section class="bottom">
<div class="place" id="place">京都市付近</div>
<div class="cards">
<div class="card"><div class="label">中心の風</div><div class="value" id="wind">-- m/s</div><div class="label" id="windDir">--</div></div>
<div class="card"><div class="label">最大瞬間</div><div class="value" id="gust">-- m/s</div><div class="label">10m高度</div></div>
<div class="card"><div class="label">波</div><div class="value" id="wave">-- m</div><div class="label" id="period">周期 -- s</div></div>
</div>
<div class="note">青矢印＝風が流れていく方向。風は画面全体に表示。青円は中心から半径5kmの目安。</div>
</section>

<div id="forecastBackdrop"></div>
<section id="forecastPanel" aria-label="時間予報">
  <div class="forecastTop">
    <div>
      <div class="forecastTitle">1時間ごとの予報</div>
      <div class="label" id="forecastPlace">現在の中心地点</div>
    </div>
    <button type="button" id="forecastClose">閉じる</button>
  </div>
  <div class="forecastBtns" style="margin-top:8px">
    <button type="button" data-range="24" class="active">24時間</button>
    <button type="button" data-range="72">3日</button>
    <button type="button" data-range="168">7日</button>
  </div>
  <div id="forecastList"></div>
  <div class="forecastFoot">
    <button type="button" id="backCurrent">現在に戻す</button>
  </div>
</section>

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);
const START={lat:35.0116,lng:135.7681};
const TILE=256, EARTH=6378137;
let center={...START}, placeName="京都市付近", zoom=13;
let windSamples=[];
let drag=null, loading=false, refreshTimer=null;
let forecastRows=[], forecastWave=null, forecastRange=24, forecastIndex=null, forecastLoading=false;
let selectedForecastTime=null, selectedForecastOffset=null;
const MODEL_INFO={
  best_match:{label:"Best Match（自動）",param:"best_match",maxHours:168,gust:true,note:"Open-Meteoが地点ごとに最適モデルを自動選択"},
  jma_msm:{label:"JMA MSM",param:"jma_msm",maxHours:96,gust:false,note:"気象庁 MSM・約5km・約4日先まで"},
  ecmwf_ifs:{label:"ECMWF IFS",param:"ecmwf_ifs",maxHours:168,gust:true,note:"ECMWF IFS・約9km・7日表示"}
};
let activeModel="best_match";
let compareMode=false;

function setStatus(s){$("status").textContent=s}
function showError(s){$("error").textContent=s;$("error").style.display="block"}
function clearError(){$("error").style.display="none"}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function compass(d){
  if(!Number.isFinite(d))return"--";
  const a=["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"];
  return a[Math.round((((d%360)+360)%360)/22.5)%16];
}
function forecastTimeLabel(iso,i){
  if(!iso)return i===0?"現在":"+"+i+"h";
  const d=new Date(iso);
  const first=forecastRows[0]&&forecastRows[0].hourly&&forecastRows[0].hourly.time&&forecastRows[0].hourly.time[0];
  const base=first?new Date(first):d;
  const hh=String(d.getHours()).padStart(2,"0");
  if(i===0)return"現在";
  if(d.getDate()===base.getDate())return hh+"時";
  return (d.getMonth()+1)+"/"+d.getDate()+" "+hh+"時";
}
function openForecastPanel(){
  $("forecastBackdrop").classList.add("open");
  $("forecastPanel").classList.add("open");
}
function closeForecastPanel(){
  $("forecastBackdrop").classList.remove("open");
  $("forecastPanel").classList.remove("open");
}
function invalidateForecast(keepSelection=false){
  forecastRows=[];forecastWave=null;forecastIndex=null;
  if(!keepSelection){
    selectedForecastTime=null;
    selectedForecastOffset=null;
  }
}
function modelInfo(){return MODEL_INFO[activeModel]||MODEL_INFO.best_match}
function windVars(){
  return modelInfo().gust
    ? "wind_speed_10m,wind_direction_10m,wind_gusts_10m"
    : "wind_speed_10m,wind_direction_10m";
}
function updateModelUI(){
  const m=modelInfo();
  $("modelNote").textContent=m.note;
  const rangeBtns=document.querySelectorAll(".forecastBtns button");
  rangeBtns.forEach(btn=>{
    if(btn.dataset.range==="168"){
      if(activeModel==="jma_msm"){
        btn.dataset.range="96";
        btn.textContent="4日";
      }else{
        btn.dataset.range="168";
        btn.textContent="7日";
      }
    }else if(btn.dataset.range==="96" && activeModel!=="jma_msm"){
      btn.dataset.range="168";
      btn.textContent="7日";
    }
  });
  if(forecastRange>m.maxHours)forecastRange=m.maxHours;
}
function angleDiff(a,b){
  const d=Math.abs((((a-b)+540)%360)-180);
  return d;
}
function comparisonLevel(values){
  const v=values.filter(x=>Number.isFinite(x.speed)&&Number.isFinite(x.dir));
  if(v.length<3)return{level:"",speedSpread:null,dirSpread:null};
  const speeds=v.map(x=>x.speed);
  const speedSpread=Math.max(...speeds)-Math.min(...speeds);
  let dirSpread=0;
  for(let i=0;i<v.length;i++)for(let j=i+1;j<v.length;j++)dirSpread=Math.max(dirSpread,angleDiff(v[i].dir,v[j].dir));
  if(speedSpread>=3 || dirSpread>=70)return{level:"bad",speedSpread,dirSpread};
  if(speedSpread>=1.5 || dirSpread>=35)return{level:"warn",speedSpread,dirSpread};
  return{level:"",speedSpread,dirSpread};
}
function updateCompareButton(){
  $("compareBtn").classList.toggle("active",compareMode);
  $("compareBtn").textContent=compareMode?"3モデル比較 ON":"3モデル比較 OFF";
  if(!compareMode)$("compareSummary").textContent="";
}


function project(lat,lng,z){
  const scale=TILE*Math.pow(2,z);
  const x=(lng+180)/360*scale;
  const sin=Math.sin(clamp(lat,-85.05112878,85.05112878)*Math.PI/180);
  const y=(0.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*scale;
  return{x,y};
}
function unproject(x,y,z){
  const scale=TILE*Math.pow(2,z);
  const lng=x/scale*360-180;
  const n=Math.PI-2*Math.PI*y/scale;
  const lat=180/Math.PI*Math.atan(Math.sinh(n));
  return{lat:clamp(lat,-85.05112878,85.05112878),lng:((lng+540)%360)-180};
}
function metersPerPixel(lat,z){
  return Math.cos(lat*Math.PI/180)*2*Math.PI*EARTH/(TILE*Math.pow(2,z));
}
function dest(lat,lng,km,bearing){
  const R=6371,d=km/R,b=bearing*Math.PI/180,p1=lat*Math.PI/180,l1=lng*Math.PI/180;
  const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(b));
  const l2=l1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));
  return{lat:p2*180/Math.PI,lng:l2*180/Math.PI};
}
function hav(a,b){
  const R=6371,t=x=>x*Math.PI/180,dp=t(b.lat-a.lat),dl=t(b.lng-a.lng);
  const x=Math.sin(dp/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function parseCoord(s){
  const m=s.trim().match(/^(-?\d{1,2}(?:\.\d+)?)\s*[,， ]\s*(-?\d{1,3}(?:\.\d+)?)$/);
  if(!m)return null;
  const lat=Number(m[1]),lng=Number(m[2]);
  return Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat,lng}:null;
}
function samplePoints(){
  const wrap=$("mapWrap");
  const w=Math.max(320,wrap.clientWidth||320);
  const h=Math.max(300,wrap.clientHeight||300);
  const cp=project(center.lat,center.lng,zoom);
  const arr=[{lat:center.lat,lng:center.lng,screenX:.5,screenY:.5,isCenter:true}];
  const xs=[.08,.29,.50,.71,.92];
  const ys=[.10,.30,.50,.70,.90];
  ys.forEach(y=>xs.forEach(x=>{
    if(Math.abs(x-.5)<.001&&Math.abs(y-.5)<.001)return;
    const px=cp.x+(x-.5)*w;
    const py=cp.y+(y-.5)*h;
    const p=unproject(px,py,zoom);
    arr.push({lat:p.lat,lng:p.lng,screenX:x,screenY:y});
  }));
  return arr;
}

function renderMap(){
  const wrap=$("mapWrap"), w=wrap.clientWidth, h=wrap.clientHeight;
  if(!w||!h)return;
  const cp=project(center.lat,center.lng,zoom);
  const left=cp.x-w/2, top=cp.y-h/2;
  const minX=Math.floor(left/TILE)-1, maxX=Math.floor((left+w)/TILE)+1;
  const minY=Math.floor(top/TILE)-1, maxY=Math.floor((top+h)/TILE)+1;
  const count=Math.pow(2,zoom);
  const frag=document.createDocumentFragment();
  for(let ty=minY;ty<=maxY;ty++){
    if(ty<0||ty>=count)continue;
    for(let tx=minX;tx<=maxX;tx++){
      const wx=((tx%count)+count)%count;
      const img=document.createElement("img");
      img.className="tile";
      img.alt="";
      img.draggable=false;
      img.src="https://tile.openstreetmap.org/"+zoom+"/"+wx+"/"+ty+".png";
      img.style.left=(tx*TILE-left)+"px";
      img.style.top=(ty*TILE-top)+"px";
      frag.appendChild(img);
    }
  }
  const tiles=$("tiles");
  tiles.replaceChildren(frag);

  const px=5000/metersPerPixel(center.lat,zoom);
  const c=$("rangeCircle");
  c.style.left=(w/2)+"px"; c.style.top=(h/2)+"px";
  c.style.width=(px*2)+"px"; c.style.height=(px*2)+"px";

  renderWindMarkers();
}

function renderWindMarkers(){
  const layer=$("windLayer");
  layer.replaceChildren();
  const wrap=$("mapWrap"), w=wrap.clientWidth, h=wrap.clientHeight;
  if(!w||!h)return;
  const cp=project(center.lat,center.lng,zoom);
  windSamples.forEach(x=>{
    if(!Number.isFinite(x.speed)||!Number.isFinite(x.dir))return;
    const p=project(x.lat,x.lng,zoom);
    const sx=w/2+(p.x-cp.x), sy=h/2+(p.y-cp.y);
    if(sx<-70||sx>w+70||sy<-70||sy>h+70)return;
    const el=document.createElement("div");
    el.className="marker"+(x.compareLevel?(" "+x.compareLevel):"");
    el.style.left=sx+"px"; el.style.top=sy+"px";
    const to=(x.dir+180)%360;
    el.innerHTML='<div class="arrow" style="transform:rotate('+to+'deg)">↑</div><div class="tag">'+x.speed.toFixed(1)+' m/s</div>';
    layer.appendChild(el);
  });
}

function normalizeJaAddress(q){
  return q.replace(/[〒]/g,"").replace(/\b\d{3}-?\d{4}\b/g,"").replace(/[　\s]+/g,"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).trim();
}
function addressQueries(q){
  const n=normalizeJaAddress(q);
  const out=[n];
  const noTail=n.replace(/(?:\d+(?:[-ー‐–—]\d+)*)$/,"");
  if(noTail&&noTail!==n)out.push(noTail);
  const spaced=noTail.replace(/(都|道|府|県)/,"$1 ").replace(/(市|区|町|村)/g,"$1 ").trim();
  if(spaced&&!out.includes(spaced))out.push(spaced);
  return [...new Set(out.filter(Boolean))];
}
async function gsiSearch(q){
  const u=new URL("https://msearch.gsi.go.jp/address-search/AddressSearch");
  u.searchParams.set("q",q);
  const r=await fetch(u,{headers:{"Accept":"application/json"}});
  if(!r.ok)throw new Error("GSI "+r.status);
  const a=await r.json();
  if(!Array.isArray(a)||!a.length)return null;
  const c=a[0]&&a[0].geometry&&a[0].geometry.coordinates;
  if(!c||c.length<2)return null;
  return{lat:Number(c[1]),lng:Number(c[0]),name:(a[0].properties&&a[0].properties.title)||q};
}
async function nominatimSearch(q){
  const u=new URL("https://nominatim.openstreetmap.org/search");
  u.searchParams.set("format","jsonv2");u.searchParams.set("q",q);u.searchParams.set("limit","1");
  u.searchParams.set("countrycodes","jp");u.searchParams.set("accept-language","ja");
  const r=await fetch(u,{headers:{"Accept":"application/json"}});
  if(!r.ok)return null;
  const a=await r.json();
  if(!a.length)return null;
  return{lat:Number(a[0].lat),lng:Number(a[0].lon),name:a[0].display_name};
}
async function geocode(q){
  const c=parseCoord(q);if(c)return{...c,name:q};
  const qs=addressQueries(q);
  for(const x of qs){try{const g=await gsiSearch(x);if(g)return g}catch(_){}}
  for(const x of qs){try{const n=await nominatimSearch(x);if(n)return n}catch(_){}}
  throw new Error("地点が見つかりません。地名だけでも試せます");
}

async function getWind(ps){
  const u=new URL("https://api.open-meteo.com/v1/forecast");
  u.searchParams.set("latitude",ps.map(p=>p.lat.toFixed(5)).join(","));
  u.searchParams.set("longitude",ps.map(p=>p.lng.toFixed(5)).join(","));
  u.searchParams.set("hourly",windVars());
  u.searchParams.set("forecast_hours","1");
  u.searchParams.set("models",modelInfo().param);
  u.searchParams.set("wind_speed_unit","ms");
  u.searchParams.set("timezone","auto");
  const r=await fetch(u);
  if(!r.ok)throw new Error("風API "+r.status);
  const d=await r.json();
  return Array.isArray(d)?d:[d];
}
async function getWindForModel(ps,modelKey){
  const m=MODEL_INFO[modelKey]||MODEL_INFO.best_match;
  const u=new URL("https://api.open-meteo.com/v1/forecast");
  u.searchParams.set("latitude",ps.map(p=>p.lat.toFixed(5)).join(","));
  u.searchParams.set("longitude",ps.map(p=>p.lng.toFixed(5)).join(","));
  u.searchParams.set("hourly","wind_speed_10m,wind_direction_10m");
  u.searchParams.set("forecast_hours","1");
  u.searchParams.set("models",m.param);
  u.searchParams.set("wind_speed_unit","ms");
  u.searchParams.set("timezone","auto");
  const r=await fetch(u);
  if(!r.ok)throw new Error(m.label+" 比較 "+r.status);
  const d=await r.json();
  return Array.isArray(d)?d:[d];
}
async function getThreeModelComparison(ps){
  const keys=["best_match","jma_msm","ecmwf_ifs"];
  const rows=await Promise.all(keys.map(k=>getWindForModel(ps,k)));
  return keys.map((key,idx)=>({key,rows:rows[idx]}));
}
function attachComparison(samples,comparison){
  if(!comparison)return{ok:0,warn:0,bad:0};
  let ok=0,warn=0,bad=0;
  samples.forEach((samp,i)=>{
    const values=comparison.map(set=>{
      const x=set.rows[i]||{};
      return{
        speed:x.hourly&&x.hourly.wind_speed_10m&&x.hourly.wind_speed_10m[0],
        dir:x.hourly&&x.hourly.wind_direction_10m&&x.hourly.wind_direction_10m[0]
      };
    });
    const c=comparisonLevel(values);
    samp.compareLevel=c.level;
    samp.speedSpread=c.speedSpread;
    samp.dirSpread=c.dirSpread;
    if(c.level==="bad")bad++;
    else if(c.level==="warn")warn++;
    else if(c.speedSpread!==null)ok++;
  });
  return{ok,warn,bad};
}

async function getWave(){
  const u=new URL("https://marine-api.open-meteo.com/v1/marine");
  u.searchParams.set("latitude",center.lat.toFixed(5));
  u.searchParams.set("longitude",center.lng.toFixed(5));
  u.searchParams.set("current","wave_height,wave_period");
  u.searchParams.set("cell_selection","sea");
  u.searchParams.set("timezone","auto");
  const r=await fetch(u);
  if(!r.ok)throw new Error("波API "+r.status);
  return r.json();
}


async function getWindForecast(ps){
  const u=new URL("https://api.open-meteo.com/v1/forecast");
  u.searchParams.set("latitude",ps.map(p=>p.lat.toFixed(5)).join(","));
  u.searchParams.set("longitude",ps.map(p=>p.lng.toFixed(5)).join(","));
  u.searchParams.set("hourly",windVars());
  u.searchParams.set("forecast_hours",String(modelInfo().maxHours));
  u.searchParams.set("models",modelInfo().param);
  u.searchParams.set("wind_speed_unit","ms");
  u.searchParams.set("timezone","auto");
  const r=await fetch(u);
  if(!r.ok)throw new Error("風予報 "+r.status);
  const d=await r.json();
  return Array.isArray(d)?d:[d];
}
async function getWaveForecast(){
  const u=new URL("https://marine-api.open-meteo.com/v1/marine");
  u.searchParams.set("latitude",center.lat.toFixed(5));
  u.searchParams.set("longitude",center.lng.toFixed(5));
  u.searchParams.set("hourly","wave_height,wave_period");
  u.searchParams.set("forecast_hours","168");
  u.searchParams.set("cell_selection","sea");
  u.searchParams.set("timezone","auto");
  const r=await fetch(u);
  if(!r.ok)throw new Error("波予報 "+r.status);
  return r.json();
}
function waveForecastAt(i){
  if(!forecastWave||!forecastWave.hourly)return null;
  const model={lat:Number(forecastWave.latitude),lng:Number(forecastWave.longitude)};
  const seaDistance=Number.isFinite(model.lat)?hav(center,model):Infinity;
  if(seaDistance>20)return null;
  return{
    h:forecastWave.hourly.wave_height&&forecastWave.hourly.wave_height[i],
    period:forecastWave.hourly.wave_period&&forecastWave.hourly.wave_period[i],
    seaDistance
  };
}
function applyForecastHour(i,scrollCard){
  if(!forecastRows.length)return;
  const ps=samplePoints();
  forecastIndex=i;
  selectedForecastOffset=i;
  selectedForecastTime=forecastRows[0]&&forecastRows[0].hourly&&forecastRows[0].hourly.time
    ? forecastRows[0].hourly.time[i]
    : selectedForecastTime;
  windSamples=forecastRows.map((x,k)=>({
    lat:ps[k]&&ps[k].lat,
    lng:ps[k]&&ps[k].lng,
    speed:x.hourly&&x.hourly.wind_speed_10m&&x.hourly.wind_speed_10m[i],
    dir:x.hourly&&x.hourly.wind_direction_10m&&x.hourly.wind_direction_10m[i],
    gust:x.hourly&&x.hourly.wind_gusts_10m&&x.hourly.wind_gusts_10m[i],
    compareLevel:""
  }));
  renderWindMarkers();

  const c=windSamples[0]||{};
  $("wind").textContent=Number.isFinite(c.speed)?c.speed.toFixed(1)+" m/s":"-- m/s";
  $("windDir").textContent=Number.isFinite(c.dir)?compass(c.dir)+"から":"--";
  $("gust").textContent=modelInfo().gust?(Number.isFinite(c.gust)?c.gust.toFixed(1)+" m/s":"-- m/s"):"提供なし";

  const w=waveForecastAt(i);
  $("wave").textContent=w&&Number.isFinite(w.h)?w.h.toFixed(1)+" m":"海域外";
  $("period").textContent=w&&Number.isFinite(w.period)?("周期 "+w.period.toFixed(1)+" s"+(w.seaDistance>5?" / 最寄海域 "+w.seaDistance.toFixed(0)+"km":"")):"周期 -- s";

  document.querySelectorAll(".hourCard").forEach(el=>el.classList.toggle("active",Number(el.dataset.index)===i));
  const iso=forecastRows[0].hourly&&forecastRows[0].hourly.time&&forecastRows[0].hourly.time[i];
  setStatus("予報："+forecastTimeLabel(iso,i)+"　地図の矢印もこの時刻");
  if(scrollCard){
    const card=document.querySelector('.hourCard[data-index="'+i+'"]');
    if(card)card.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  }
}
function renderForecastList(){
  const list=$("forecastList");
  list.replaceChildren();
  if(!forecastRows.length)return;
  const h=forecastRows[0].hourly||{};
  const total=Math.min(forecastRange,(h.time&&h.time.length)||0);
  for(let i=0;i<total;i++){
    const sp=h.wind_speed_10m&&h.wind_speed_10m[i];
    const di=h.wind_direction_10m&&h.wind_direction_10m[i];
    const gu=h.wind_gusts_10m&&h.wind_gusts_10m[i];
    const w=waveForecastAt(i);
    const b=document.createElement("button");
    b.type="button";
    b.className="hourCard"+(forecastIndex===i?" active":"");
    b.dataset.index=String(i);
    b.innerHTML=
      '<div class="hourTime">'+forecastTimeLabel(h.time&&h.time[i],i)+'</div>'+
      '<div class="hourWind">'+(Number.isFinite(sp)?sp.toFixed(1):"--")+' m/s</div>'+
      '<div class="hourMeta">'+(Number.isFinite(di)?compass(di)+"から":"--")+
      '<br>瞬 '+(modelInfo().gust?(Number.isFinite(gu)?gu.toFixed(1)+" m/s":"--"):"提供なし")+
      (w&&Number.isFinite(w.h)?'<br>波 '+w.h.toFixed(1)+' m'+(w.seaDistance>5?'（最寄海域）':''):'')+
      '</div>';
    b.addEventListener("click",()=>applyForecastHour(i,false));
    list.appendChild(b);
  }
}
async function loadForecast(){
  if(forecastLoading)return;
  forecastLoading=true;
  updateModelUI();
  clearError();
  $("forecastPlace").textContent=placeName;
  openForecastPanel();
  setStatus("時間予報を取得中…（比較色は現在値のみ）");
  $("forecastList").innerHTML='<div class="label" style="padding:14px">予報を読み込み中…</div>';
  try{
    const ps=samplePoints();
    const [rows,wave]=await Promise.all([
      getWindForecast(ps),
      getWaveForecast().catch(()=>null)
    ]);
    forecastRows=rows;
    forecastWave=wave;
    let keepIndex=null;
    const times=forecastRows[0]&&forecastRows[0].hourly&&forecastRows[0].hourly.time;
    if(selectedForecastTime&&times){
      const exact=times.indexOf(selectedForecastTime);
      if(exact>=0)keepIndex=exact;
      else if(Number.isInteger(selectedForecastOffset)&&selectedForecastOffset<times.length)keepIndex=selectedForecastOffset;
    }
    forecastIndex=keepIndex;
    renderForecastList();
    if(keepIndex!==null)applyForecastHour(keepIndex,false);
    else setStatus("予報を選ぶと地図の矢印も切り替わります");
  }catch(e){
    $("forecastList").innerHTML='<div class="label" style="padding:14px">予報を取得できません</div>';
    showError("予報取得エラー："+(e.message||e));
    setStatus("⚠️ 予報取得失敗");
  }finally{
    forecastLoading=false;
  }
}
async function refreshSelectedForecast(){
  if(!selectedForecastTime||forecastLoading){
    refreshData();
    return;
  }
  forecastLoading=true;
  clearError();
  setStatus("選択中の予報時刻を新しい場所で取得中…");
  $("place").textContent=placeName+"　(青円5km)";
  try{
    const ps=samplePoints();
    const [rows,wave]=await Promise.all([
      getWindForecast(ps),
      getWaveForecast().catch(()=>null)
    ]);
    forecastRows=rows;
    forecastWave=wave;
    const times=forecastRows[0]&&forecastRows[0].hourly&&forecastRows[0].hourly.time;
    let target=-1;
    if(times){
      target=times.indexOf(selectedForecastTime);
      if(target<0&&Number.isInteger(selectedForecastOffset)&&selectedForecastOffset<times.length){
        target=selectedForecastOffset;
      }
    }
    if(target>=0){
      applyForecastHour(target,false);
    }else{
      selectedForecastTime=null;
      selectedForecastOffset=null;
      refreshData();
    }
  }catch(e){
    showError("予報取得エラー："+(e.message||e));
    setStatus("⚠️ 選択時刻の予報取得失敗");
  }finally{
    forecastLoading=false;
  }
}

async function refreshData(){
  if(loading)return;
  loading=true;
  clearError();
  setStatus(modelInfo().label+" の風を取得中…");
  $("place").textContent=placeName+"　(青円5km)";
  try{
    const ps=samplePoints();
    const comparePromise=compareMode?getThreeModelComparison(ps).catch(()=>null):Promise.resolve(null);
    const [rows,comparison]=await Promise.all([getWind(ps),comparePromise]);
    windSamples=rows.map((x,i)=>({
      lat:ps[i].lat,lng:ps[i].lng,
      speed:x.hourly&&x.hourly.wind_speed_10m&&x.hourly.wind_speed_10m[0],
      dir:x.hourly&&x.hourly.wind_direction_10m&&x.hourly.wind_direction_10m[0],
      gust:x.hourly&&x.hourly.wind_gusts_10m&&x.hourly.wind_gusts_10m[0],
      compareLevel:""
    }));
    if(compareMode){
      const sum=attachComparison(windSamples,comparison);
      $("compareSummary").textContent=comparison
        ?("比較：一致 "+sum.ok+" / 注意 "+sum.warn+" / 大差 "+sum.bad+"　黄・赤ほどモデル差が大きい")
        :"3モデル比較データを取得できませんでした";
    }else{
      $("compareSummary").textContent="";
    }
    renderWindMarkers();

    const c=windSamples[0]||{};
    $("wind").textContent=Number.isFinite(c.speed)?c.speed.toFixed(1)+" m/s":"-- m/s";
    $("windDir").textContent=Number.isFinite(c.dir)?compass(c.dir)+"から":"--";
    $("gust").textContent=modelInfo().gust?(Number.isFinite(c.gust)?c.gust.toFixed(1)+" m/s":"-- m/s"):"提供なし";

    try{
      const w=await getWave();
      const model={lat:Number(w.latitude),lng:Number(w.longitude)};
      const seaDistance=Number.isFinite(model.lat)?hav(center,model):Infinity;
      const near=seaDistance<=20;
      const cur=w.current||{};
      $("wave").textContent=near&&Number.isFinite(cur.wave_height)?cur.wave_height.toFixed(1)+" m":"海域外";
      $("period").textContent=near&&Number.isFinite(cur.wave_period)?("周期 "+cur.wave_period.toFixed(1)+" s"+(seaDistance>5?" / 最寄海域 "+seaDistance.toFixed(0)+"km":"")):"周期 -- s";
    }catch(_){
      $("wave").textContent="取得不可";
      $("period").textContent="周期 -- s";
    }
    setStatus(compareMode?("✅ "+modelInfo().label+"表示＋3モデル差分"):("✅ "+modelInfo().label+"：画面全体の風を表示"));
  }catch(e){
    showError("データ取得で停止："+(e.message||e));
    setStatus("⚠️ データ取得失敗");
  }finally{
    loading=false;
  }
}

function scheduleRefresh(){
  clearTimeout(refreshTimer);
  refreshTimer=setTimeout(()=>{
    if(selectedForecastTime)refreshSelectedForecast();
    else refreshData();
  },250);
}

function moveTo(c,name){
  invalidateForecast();
  closeForecastPanel();
  center={lat:Number(c.lat),lng:Number(c.lng)};
  placeName=name||("地図中心 "+center.lat.toFixed(5)+","+center.lng.toFixed(5));
  renderMap();
  scheduleRefresh();
}

const map=$("mapWrap");
map.addEventListener("pointerdown",e=>{
  if(e.target.closest("button"))return;
  e.preventDefault();
  map.setPointerCapture(e.pointerId);
  const p=project(center.lat,center.lng,zoom);
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,cx:p.x,cy:p.y,moved:false};
  map.classList.add("dragging");
});
map.addEventListener("pointermove",e=>{
  if(!drag||drag.id!==e.pointerId)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
  center=unproject(drag.cx-dx,drag.cy-dy,zoom);
  placeName="地図で選択した地点";
  renderMap();
});
function endDrag(e){
  if(!drag||drag.id!==e.pointerId)return;
  try{map.releasePointerCapture(e.pointerId)}catch(_){}
  const moved=drag.moved;
  drag=null;
  map.classList.remove("dragging");
  if(moved){
    invalidateForecast(true);
    closeForecastPanel();
    $("place").textContent="地図で選択した地点　(青円5km)";
    scheduleRefresh();
  }
}
map.addEventListener("pointerup",endDrag);
map.addEventListener("pointercancel",endDrag);

$("zoomIn").addEventListener("click",()=>{
  zoom=Math.min(17,zoom+1);
  invalidateForecast(true);
  closeForecastPanel();
  renderMap();
  scheduleRefresh();
});
$("zoomOut").addEventListener("click",()=>{
  zoom=Math.max(8,zoom-1);
  invalidateForecast(true);
  closeForecastPanel();
  renderMap();
  scheduleRefresh();
});
$("modelSelect").addEventListener("change",()=>{
  activeModel=$("modelSelect").value;
  invalidateForecast(true);
  closeForecastPanel();
  updateModelUI();
  if(selectedForecastTime)refreshSelectedForecast();
  else refreshData();
});
$("compareBtn").addEventListener("click",()=>{
  compareMode=!compareMode;
  updateCompareButton();
  invalidateForecast();
  closeForecastPanel();
  refreshData();
});
$("forecastBtn").addEventListener("click",()=>{
  if(forecastRows.length){$("forecastPlace").textContent=placeName;openForecastPanel();renderForecastList()}
  else loadForecast();
});
$("forecastClose").addEventListener("click",closeForecastPanel);
$("forecastBackdrop").addEventListener("click",closeForecastPanel);
$("backCurrent").addEventListener("click",()=>{
  invalidateForecast();
  closeForecastPanel();
  refreshData();
});
document.querySelectorAll(".forecastBtns button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    forecastRange=Number(btn.dataset.range)||24;
    document.querySelectorAll(".forecastBtns button").forEach(x=>x.classList.toggle("active",x===btn));
    renderForecastList();
  });
});
$("refreshBtn").addEventListener("click",()=>{
  invalidateForecast();
  closeForecastPanel();
  refreshData();
});
$("kyotoBtn").addEventListener("click",()=>moveTo(START,"京都市付近"));

$("locateBtn").addEventListener("click",()=>{
  clearError();setStatus("現在地取得中…");
  if(!navigator.geolocation){showError("このブラウザは現在地に非対応");return}
  navigator.geolocation.getCurrentPosition(
    p=>moveTo({lat:p.coords.latitude,lng:p.coords.longitude},"現在地"),
    e=>{showError("現在地エラー："+e.message);setStatus("現在地を取得できません")},
    {enableHighAccuracy:true,timeout:12000,maximumAge:30000}
  );
});

$("searchForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const q=$("query").value.trim();
  if(!q)return;
  clearError();setStatus("日本住所を検索中…");
  try{
    const r=await geocode(q);
    moveTo(r,r.name);
  }catch(err){
    showError(err.message||"検索失敗");
    setStatus("住所検索失敗");
  }
});

window.addEventListener("resize",renderMap);
updateModelUI();
updateCompareButton();
renderMap();
refreshData();
})();
</script>
